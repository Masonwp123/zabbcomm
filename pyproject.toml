[project]
name = "zabbcomm"
version = "0.1.0"
description = "Receive endpoint check-ins and report org, site and device status to Zabbix"
readme = "README.md"
authors = [
    { name = "Mason" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
    "zabbix-utils>=2.0.5",
]

[project.scripts]
zabbcomm = "zabbcomm:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
