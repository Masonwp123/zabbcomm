name: Publish Docker image

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: Install uv
        run: pipx install uv==0.13.10

      - name: Lint and test
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to rank this release

      # Moving tags (latest, 1, 1.2) only follow the highest version they cover, so a
      # patch to an older release can't move them backwards.
      - name: Rank this release
        id: rank
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          releases="$(git tag --list | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)"
          is_newest() {
            if [ "$(echo "$releases" | grep -E "^$1" | tail -n1)" = "$version" ]; then
              echo true
            else
              echo false
            fi
          }
          major="${version%%.*}"
          minor="${version%.*}"
          {
            echo "latest=$(is_newest '')"
            echo "major=$(is_newest "${major}\.")"
            echo "minor=$(is_newest "${minor//./\\.}\.")"
          } >> "$GITHUB_OUTPUT"

      - name: Setup QEMU for arm64
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rank.outputs.minor }}
            type=semver,pattern={{major}},enable=${{ steps.rank.outputs.major }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease && steps.rank.outputs.latest == 'true' }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
